<!DOCTYPE html>
<!-- Source for the OG/link-preview image. Render to src/img/og-card.png at 1200x630
     (e.g. Chrome headless --screenshot). Edit the text below, then re-render. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0e0e10; --fg: #ededec; --muted: #9a9aa2; --accent: #2f9e74;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  html, body { width: 1200px; height: 630px; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); position: relative; overflow: hidden; }
  body::before { content: ""; position: absolute; top: -220px; left: -160px; width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(47,158,116,0.13) 0%, rgba(47,158,116,0) 68%); }
  .wrap { position: absolute; left: 80px; top: 50%; transform: translateY(-50%); max-width: 900px; }
  .eyebrow { font-size: 22px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 26px; }
  h1 { font-size: 92px; font-weight: 800; line-height: 1.02; letter-spacing: -0.02em; margin-bottom: 24px; }
  .tagline { font-size: 38px; font-weight: 500; color: var(--fg); }
  .url { font-size: 24px; font-weight: 600; color: var(--accent); margin-top: 40px; }
  .accent-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 10px; background: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Your Role · Your Field</div>
    <h1>Your Name</h1>
    <div class="tagline">Your one-line tagline.</div>
    <div class="url">your-username.github.io</div>
  </div>
  <div class="accent-bar"></div>
</body>
</html>
